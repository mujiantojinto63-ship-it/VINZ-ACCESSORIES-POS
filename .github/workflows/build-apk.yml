name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Locate and Build Project
      run: |
        # Mencari folder yang memiliki file build.gradle atau build.gradle.kts
        PROJECT_PATH=$(find . -maxdepth 3 -name "build.gradle*" -not -path "*/.*" -exec dirname {} \;)
        
        if [ -z "$PROJECT_PATH" ]; then
          echo "Error: File build.gradle tidak ditemukan!"
          exit 1
        fi
        
        echo "Proyek ditemukan di folder: $PROJECT_PATH"
        cd "$PROJECT_PATH"
        
        # Jika file gradlew belum ada di folder proyek, buat wrapper otomatis
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
