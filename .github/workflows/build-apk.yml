name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build APK with Gradle
      run: |
        # Cari file gradlew secara otomatis di seluruh folder project
        GRADLEW_PATH=$(find . -name "gradlew" -type f)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Gradle wrapper tidak ditemukan, membuat wrapper baru..."
          gradle wrapper
          GRADLEW_PATH="./gradlew"
        fi
        
        chmod +x $GRADLEW_PATH
        $GRADLEW_PATH assembleDebug -Pksp.mode=disabled

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
