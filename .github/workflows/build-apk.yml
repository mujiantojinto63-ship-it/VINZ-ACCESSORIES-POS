name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Remove local keystore config causing error
      run: |
        # Cari file build.gradle atau build.gradle.kts di dalam folder app dan hapus blok signingConfigs-nya secara aman
        find . -path "*/app/build.gradle*" -type f -exec sed -i '/signingConfigs {/,/}/d' {} +
        find . -path "*/app/build.gradle*" -type f -exec sed -i '/signingConfig /d' {} +

    - name: Build APK with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" -type f)
        if [ -z "$GRADLEW_PATH" ]; then
          gradle wrapper
          GRADLEW_PATH="./gradlew"
        fi
        
        chmod +x $GRADLEW_PATH
        $GRADLEW_PATH assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
